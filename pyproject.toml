[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tender-ai"
version = "0.1.0"
description = "Procurement Intelligence Agent - Stufe 1: automatisierte Ausschreibungsrecherche"
readme = "README.md"
requires-python = ">=3.12"
# Einzige Quelle der Abhaengigkeiten. requirements*.txt werden daraus
# generiert (siehe README, Abschnitt "Abhaengigkeiten") und nicht von Hand gepflegt.
dependencies = [
    "httpx[http2]>=0.27,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "SQLAlchemy>=2.0,<3",
    "typer>=0.12,<1",
    "rich>=13.7,<16",
    "PyYAML>=6.0,<7",
    "python-dotenv>=1.0,<2",
    "structlog>=24.1,<27",
    "feedparser>=6.0,<7",
    "alembic>=1.13,<2",
    # Stufe 2: Auslesen der Vergabeunterlagen
    "pdfplumber>=0.11,<1",
    "python-docx>=1.1,<2",
    "openpyxl>=3.1,<4",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5.0,<7",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.1,<4"]  # bereits in dependencies; Extra bleibt fuer Kompatibilitaet
# Stufe 9: lokale Weboberflaeche. Bewusst optional - wer nur die CLI und den
# cron-Lauf braucht, installiert keinen Webserver mit.
web = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    # Formulare (Freigabe, Anmeldung) - FastAPI verlangt es fuer Form-Felder.
    "python-multipart>=0.0.9,<1",
]
dev = [
    "pytest>=8.0,<10",
    "pytest-asyncio>=0.23,<2",
    "pytest-cov>=5.0,<8",
    "respx>=0.21,<1",
    "anyio>=4.3,<5",
    "openpyxl>=3.1,<4",
    "ruff>=0.6,<1",
    "mypy>=1.10,<2",
    "pip-audit>=2.7,<3",
    "types-PyYAML",
    # erzeugt Beispiel-PDFs fuer die Extraktionstests
    "fpdf2>=2.7,<3",
    # Stufe 9 wird mitgetestet, deshalb im Entwicklungsstand enthalten.
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "python-multipart>=0.0.9,<1",
]

[project.scripts]
tender-ai = "tender_ai.cli:app"

[tool.setuptools.packages.find]
include = ["tender_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["slow: laufzeitintensive Tests (Benchmarks)"]

[tool.coverage.run]
branch = false
source = ["tender_ai"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE", "DTZ", "SIM", "C4", "ISC", "PYI", "FURB"]
ignore = [
    # Typer-Konvention: typer.Option(...) als Default-Argument ist das offizielle API.
    "B008",
    # Konflikt mit ruff format (implizite String-Konkatenation ueber Zeilen).
    "ISC001",
]

[tool.ruff.lint.per-file-ignores]
# Tests duerfen naive Zeitangaben, breite excepts und dict(...)-Builder verwenden.
"tests/*" = ["DTZ", "BLE001", "C408"]
# Von Alembic generierte Revisionen bleiben unveraendert erhalten.
"tender_ai/database/alembic/versions/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["tender_ai"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
files = ["tender_ai"]
