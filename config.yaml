# =============================================================================
# tender-ai Konfiguration
# =============================================================================
# Alle Werte koennen ueber Umgebungsvariablen mit dem Praefix TENDER_AI_
# ueberschrieben werden (verschachtelt mit "__", z. B. TENDER_AI_HTTP__TIMEOUT).
# Secrets gehoeren NICHT hierher, sondern in die .env-Datei.

# --- HTTP / Netzwerkverhalten ------------------------------------------------
http:
  timeout: 30.0                 # Sekunden pro Request
  connect_timeout: 10.0
  max_retries: 4                # Wiederholungen bei 429/5xx/Netzwerkfehlern
  backoff_base: 1.0             # Exponential Backoff: base * 2**versuch (+ Jitter)
  backoff_max: 30.0
  user_agent: "tender-ai/0.1 (+mailto:kontakt@example.org)"
  respect_robots: true          # robots.txt wird vor jedem Abruf geprueft
  requests_per_second: 1.0      # globales Default-Rate-Limit pro Host
  cache_enabled: true
  cache_ttl_seconds: 900        # HTTP-Response-Cache (Entwicklung/Wiederholläufe)
  max_download_bytes: 50000000  # Obergrenze je Dokumentdownload (50 MB)
  max_feed_bytes: 5000000       # Obergrenze je Feed-Antwort (5 MB)

# --- Suche (Default-Filter, per CLI ueberschreibbar) -------------------------
search:
  keywords: []                  # z. B. ["Monitor", "Bueroausstattung"]
  cpv_codes: []                 # z. B. ["30231300", "30190000"]
  countries: ["DEU"]            # ISO-3166-alpha-3, TED-Notation
  published_within_days: 14
  min_days_until_deadline: 3    # Ausschreibungen mit zu knapper Frist ueberspringen
  max_results_per_source: 100

# --- Quellen -----------------------------------------------------------------
# Jede Quelle ist einzeln aktivierbar. Reihenfolge in "priority" bestimmt,
# welche Quelle bei Dubletten als Primaerquelle markiert wird (kleiner = besser).
sources:
  ted:
    enabled: true
    type: ted
    priority: 10
    # Offizielle Such-API von TED (Tenders Electronic Daily, EU-Amtsblatt S).
    # Endpunkt und Feldliste sind bewusst konfigurierbar, weil die TED-API
    # versioniert wird - bei Aenderungen hier anpassen statt im Code.
    base_url: "https://api.ted.europa.eu"
    search_path: "/v3/notices/search"
    # Optionaler API-Key (aus .env: TENDER_AI_TED_API_KEY). Ohne Key gelten
    # die anonymen Rate-Limits von TED.
    auth_header: "Authorization"
    auth_scheme: "ApiKey"       # ergibt Header: Authorization: ApiKey <key>
    requests_per_second: 0.5
    page_size: 50
    fields:
      - "publication-number"
      - "notice-title"
      - "description-lot"
      - "buyer-name"
      - "buyer-country"
      - "publication-date"
      - "deadline-receipt-request"
      - "classification-cpv"
      - "notice-type"
      - "procedure-type"
      - "total-value"
      - "estimated-value-lot"
      - "place-performance-country-part"
      - "links"
    # Feldnamen der TED-Expert-Query. Falls TED die Notation aendert, hier
    # anpassen (siehe docs/architecture.md, Abschnitt "Technische Risiken").
    query_fields:
      fulltext: "FT"
      cpv: "classification-cpv"
      country: "buyer-country"
      publication_date: "publication-date"
      deadline: "deadline-receipt-request"
    # Optional: komplette Expert-Query selbst vorgeben (ueberschreibt den Builder)
    raw_query: null

  bund_rss:
    enabled: true
    type: rss
    priority: 20
    requests_per_second: 0.5
    # Oeffentliche RSS-Feeds von Vergabeportalen. Weitere Feeds koennen hier
    # ohne Codeaenderung ergaenzt werden.
    feeds:
      - name: "service.bund.de Ausschreibungen"
        url: "https://www.service.bund.de/SiteGlobals/Functions/RSSFeed/DE/RSSNewsfeed/RSSNewsfeed_Ausschreibungen.xml"
        country: "DEU"
        authority: null         # falls der Feed genau eine Vergabestelle abbildet

  # Vergabemarktplatz NRW - Landesportal ohne oeffentliche Schnittstelle.
  # Gelesen wird ausschliesslich die frei erreichbare Trefferliste, ueber den
  # normalen HTTP-Client und damit mit robots.txt-Pruefung und Rate-Limit.
  #
  # WICHTIG - vor dem Aktivieren einmal pruefen:
  #   tender-ai doctor --source evergabe_nrw
  # Der Health-Check meldet je Feld, in wie vielen Zeilen es gefunden wurde
  # ("title 20/21, submission_deadline 0/21"). Erst wenn die Pflichtfelder
  # Treffer liefern, ergibt ein Dauerbetrieb Sinn - bis dahin bleibt die Quelle
  # aus, statt bei jedem Lauf leere Ergebnisse und Fehlerzaehler zu erzeugen.
  # Die Selektoren unten sind ein Startpunkt und ohne Codeaenderung anpassbar.
  evergabe_nrw:
    enabled: false
    type: html_list
    priority: 40
    requests_per_second: 0.5    # bewusst langsam - fremde Infrastruktur
    label: "Vergabemarktplatz NRW"
    base_url: "https://www.evergabe.nrw.de"
    list_url: "https://www.evergabe.nrw.de/VMPCenter/company/announcements/categoryOverview.do?method=show"
    country: "DEU"
    region: "Nordrhein-Westfalen"
    timezone: "Europe/Berlin"   # Fristen stehen dort als Ortszeit ohne Offset
    row_selector: "table tr"
    required_fields: ["title", "detail_url"]
    id_param: "id"              # Query-Parameter der Detail-URL als Quell-ID
    max_pages: 1
    follow_detail: false        # erst einschalten, wenn die Liste stimmt
    fields:
      title:
        selector: "a"
      detail_url:
        selector: "a"
        attribute: "href"
      contracting_authority:
        selector: "td:nth-of-type(2)"
      submission_deadline:
        selector: "td:nth-of-type(3)"
    # Beispiel fuer die Detailseite - Selektoren erst nach Pruefung setzen:
    # detail_fields:
    #   description: {selector: "div.description"}
    #   national_id: {selector: "div.reference"}

  fixture:
    enabled: false              # Offline-Demoquelle (data/fixtures/*.json)
    type: fixture
    priority: 90
    path: "data/fixtures/sample_tenders.json"

# --- Preisquellen (Stufe 4) --------------------------------------------------
# Bevorzugt werden Lieferantenpreislisten: der Einkaufspreis aus der eigenen
# Liste ist der Preis, zu dem tatsaechlich beschafft wird - ein Schaufenster-
# preis ist es nicht. Formate: CSV, XLSX, JSON.
price_sources:
  beispiel_liste:
    enabled: false            # Demoliste; eigene Liste eintragen und aktivieren
    type: catalog
    priority: 10
    path: "data/fixtures/beispiel_preisliste.csv"
    supplier: "Beispiel-Distribution"
    # Ausdrueckliche Ansage, falls die Liste die Bezugsgroesse nicht je Zeile
    # ausweist. Ohne diese Angabe bleibt sie UNKNOWN - das Tool raet nicht, ob
    # ein Preis netto oder brutto ist.
    default_basis: "netto"
    default_vat_rate: 0.19
    default_currency: "EUR"
    # Spaltenzuordnung: logischer Name -> Ueberschrift in der Datei. Nur
    # abweichende Spalten muessen genannt werden.
    columns:
      product_name: "Bezeichnung"
      manufacturer: "Hersteller"
      model_number: "Typ"
      article_number: "Artikelnummer"
      amount: "Preis"
      currency: "Waehrung"
      basis: "Preisbasis"
      vat_rate: "MwSt"
      unit: "Einheit"
      tiers: "Staffelpreise"        # "50:179,00|100:172,50"
      shipping_cost: "Versandkosten"
      min_order_quantity: "Mindestmenge"
      availability: "Verfuegbarkeit"
      lead_time_days: "Lieferzeit"
      supplier: "Lieferant"
      price_date: "Preisstand"

# --- Preisrecherche ----------------------------------------------------------
pricing:
  max_offers_per_item: 10     # Angebote je Position, die behalten werden
  max_items: 200              # Positionen je Ausschreibung
  spread_warning_ratio: 0.5   # Warnung ab dieser Preisstreuung (Anteil Median)
  # Waehrungen, mit denen gerechnet wird. Es wird bewusst NICHT umgerechnet -
  # ein erfundener Kurs waere ein erfundener Preis.
  currencies: ["EUR"]

# --- Kalkulation (Stufe 5) ---------------------------------------------------
# Aus Einkaufspreisen wird ein Angebotspreis. Das Ergebnis ist eine
# Entscheidungsvorlage - kein Angebot und keine Abgabe.
calculation:
  markup_percent: 25.0            # Aufschlag auf die Selbstkosten
  overhead_percent: 8.0           # Gemeinkosten auf den Einkaufswert
  handling_cost_per_position: 0.0 # Pauschale je Position (Bestellung, Handling)
  fixed_cost_per_tender: 0.0      # Pauschale je Auftrag (Angebotserstellung)
  include_shipping: true          # Versandkosten aus den Angeboten mitrechnen
  # Ohne diese Abdeckung wird nicht bewertet: die Marge eines Bruchteils der
  # Positionen ist nicht die Marge des Auftrags.
  minimum_coverage_percent: 80

# --- Dubletten ---------------------------------------------------------------
dedup:
  enabled: true
  title_similarity_threshold: 0.90   # 0..1, fuer den Fallback-Titelvergleich
  match_window_days: 21              # max. Abstand der Veroeffentlichungsdaten
  max_authority_candidates: 200      # Kandidaten je Vergabestelle ausserhalb der Blocking-Gruppe

# --- Mindestkriterien (ab Stufe 4 wirksam, hier bereits vorbereitet) ---------
criteria:
  minimum_margin_percent: 15
  minimum_profit_eur: 500
  minimum_roi_percent: 20
  maximum_risk_score: 40
  minimum_match_confidence: 85
  minimum_days_until_deadline: 3
  preferred_currencies: ["EUR"]
  excluded_categories: []

# --- Score-Klassifizierung (ab Stufe 4 wirksam) ------------------------------
scoring:
  thresholds:
    very_interesting: 90
    interesting: 75
    review: 60
    rather_uninteresting: 40

# --- Logging -----------------------------------------------------------------
logging:
  level: "INFO"
  format: "console"             # "console" oder "json"
